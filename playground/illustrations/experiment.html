<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fig 1 · Experiment — Tracks</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0d0e;
      --panel: #171a1b;
      --edge: #2a3032;
      --line: #e4e1d8;
      --detail: #7d8682;
      --body: #171a1b;
      --deck: #1c2223;
      --ink: #5fd39a;
      --ink-hi: #d8ffee;
      --live: #5fd39a;
      --glass: #101416;
      --paper: #c9c6be;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #e9eaea;
      --panel: #f6f6f5;
      --edge: #d6d8d8;
      --line: #1c2224;
      --detail: #8a938f;
      --body: #f4f5f4;
      --deck: #e7ebe9;
      --ink: #0d7a49;
      --ink-hi: #083d26;
      --live: #0e8f56;
      --glass: #e3e8e6;
      --paper: #3c4442;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg: #e9eaea;
        --panel: #f6f6f5;
        --edge: #d6d8d8;
        --line: #1c2224;
        --detail: #8a938f;
        --body: #f4f5f4;
        --deck: #e7ebe9;
        --ink: #0d7a49;
        --ink-hi: #083d26;
        --live: #0e8f56;
        --glass: #e3e8e6;
        --paper: #3c4442;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 13px;
      padding: 20px 16px 32px;
    }
    main { max-width: 880px; margin-inline: auto; display: grid; gap: 14px; }
    figure {
      margin: 0;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 22px;
      padding: 22px 26px 18px;
      display: grid;
      gap: 6px;
    }
    .cap {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 4px 18px;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .cap .fig, .cap .hi { text-transform: none; letter-spacing: 0.04em; }
    .cap .hi { color: var(--ink-hi); }
    svg { width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; }
    svg:focus-visible { outline: 2px solid var(--live); outline-offset: 4px; border-radius: 8px; }
    p { margin: 0; max-width: 68ch; line-height: 1.6; }
    kbd { font: inherit; color: var(--ink); border: 1px solid var(--edge); border-radius: 4px; padding: 0 4px; }
    .tools { display: flex; gap: 12px; align-items: center; }
    button {
      font: inherit;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--edge);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:hover, button:focus-visible { border-color: var(--live); outline: none; }
    @media (prefers-reduced-motion: reduce) { .press { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <figure>
      <div class="cap"><span class="fig">Fig 1</span><span>Experiment</span></div>
      <svg id="stage" viewBox="24 20 520 440" role="img" tabindex="0" aria-label="Isometric figure of a Tracks experiment. Press the tools switch to send the same task to three agents with or without tools.">
        <style>
          .face { fill: var(--body); stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
          .face.top { fill: var(--deck); }
          .detail { fill: none; stroke: var(--detail); stroke-width: 1; vector-effect: non-scaling-stroke; }
          .glass { fill: var(--glass); stroke: var(--detail); stroke-width: 1; vector-effect: non-scaling-stroke; }
          .crystal { fill: none; stroke: var(--live); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; pointer-events: none; }
          .particle { fill: var(--live); stroke: none; pointer-events: none; }
          .label, .lcd, .quiet { font-family: var(--mono); pointer-events: none; }
          .label { fill: var(--live); font-size: 8px; letter-spacing: 0.14em; }
          .lcd { fill: var(--live); font-size: 9px; letter-spacing: 0.08em; }
          .lcd.big { font-size: 13px; letter-spacing: 0.12em; }
          .lcd.miss, .quiet { fill: var(--detail); }
          .quiet { font-size: 7px; letter-spacing: 0.14em; }
          .pip { fill: var(--detail); stroke: none; }
          .press, .press .face { cursor: pointer; }
          .press { transition: transform 60ms ease-out; }
          .press.down { transform: translateY(4px); }
          .press.down .face, .press:hover .face.top, .agent.lit .face { stroke: var(--live); }
          .lever.on { transform: translate(14px, 8px); }
          .lever.on.down { transform: translate(14px, 12px); }
          .lever.on .pip { fill: var(--live); }
          #crystals, #dust { opacity: 0.38; }
          #crystals.on, #dust.on { opacity: 1; }
          .hit { fill: transparent; stroke: none; }
        </style>
        <g id="scene"></g>
      </svg>
      <div class="cap"><span>Press the switch</span><span class="hi" id="readout" aria-live="polite">with tools · pass 3/3</span></div>
    </figure>
    <p>The same task goes to three agents. <kbd>T</kbd> toggles tools. <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> read one agent. Without tools only agent A passes.</p>
    <p class="tools"><button type="button" id="save">Save SVG</button></p>
  </main>
  <script>
    const C = Math.cos(Math.PI / 6), S = Math.sin(Math.PI / 6), OX = 250, OY = 168;
    const P = (x, y, z) => [(x - y) * C + OX, (x + y) * S - z + OY];
    const D = (x, y, z) => [(x - y) * C, (x + y) * S - z];
    const plane = (O, U, V) => { const o = P(...O), u = D(...U), v = D(...V); return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
    const TOP = (x, y, z) => plane([x, y, z], [1, 0, 0], [0, 1, 0]);
    const FRONT = (x, y, z) => plane([x, y, z], [1, 0, 0], [0, 0, -1]);
    const SIDE = (x, y, z) => plane([x, y, z], [0, -1, 0], [0, 0, -1]);
    const rect = (t, w, h, r = 0, cls = "face") => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
    const box = (x, y, z, w, d, h, r = 0) =>
      rect(SIDE(x + w, y + d, z + h), d, h, Math.min(r, h / 4)) +
      rect(FRONT(x, y + d, z + h), w, h, Math.min(r, h / 4)) +
      rect(TOP(x, y, z + h), w, d, r, "face top");

    function gem(t, s = 1) {
      const u = (n) => +(n * s).toFixed(2);
      const one = (dx, dy) => {
        const pts = [[18, 0], [36, 14], [31, 58], [18, 74], [5, 58], [0, 14]].map(([x, y]) => `${u(x) + dx},${u(y) + dy}`).join(" ");
        const d = `M ${u(18) + dx} ${dy} L ${u(18) + dx} ${u(74) + dy} M ${dx} ${u(14) + dy} L ${u(18) + dx} ${u(26) + dy} L ${u(36) + dx} ${u(14) + dy} M ${u(5) + dx} ${u(58) + dy} L ${u(18) + dx} ${u(26) + dy} L ${u(31) + dx} ${u(58) + dy}`;
        return `<polygon class="crystal" points="${pts}"/><path class="crystal" d="${d}"/>`;
      };
      return `<g transform="${t}">${one(0, 0)}${one(u(8), u(5))}</g>`;
    }

    function dust(spots) {
      return `<g id="dust" class="on">${spots.map(([x, y, z, r]) => {
        const [sx, sy] = P(x, y, z);
        return `<circle class="particle" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${r}"/>`;
      }).join("")}</g>`;
    }

    const agents = [
      { id: "a", x: 18, passWithout: true },
      { id: "b", x: 111, passWithout: false },
      { id: "c", x: 204, passWithout: false },
    ];

    let svg = box(0, 0, 0, 300, 210, 16, 8);
    svg += `<g transform="${TOP(0, 0, 16)}"><path class="detail" d="M150 22 L57 88 M150 22 L150 88 M150 22 L243 88"/></g>`;
    svg += `<g id="crystals" class="on">${gem(FRONT(108, 2, 164), 0.48)}${gem(FRONT(4, 64, 108), 0.4)}${gem(FRONT(262, 66, 104), 0.38)}</g>`;
    svg += box(50, 12, 16, 200, 10, 96, 3);
    svg += `<g transform="${FRONT(50, 22, 112)}"><rect class="glass" x="14" y="14" width="172" height="70" rx="4"/></g>`;
    for (const agent of agents) {
      svg += `<g class="press agent" id="agent-${agent.id}" data-press="${agent.id}">`;
      svg += box(agent.x, 88, 16, 78, 64, 52, 4);
      svg += `<g transform="${TOP(agent.x, 88, 68)}"><text class="label" x="39" y="36" text-anchor="middle">${agent.id.toUpperCase()}</text></g>`;
      svg += `<g transform="${FRONT(agent.x, 152, 68)}"><rect class="glass" x="10" y="10" width="58" height="32" rx="3"/></g>`;
      svg += `</g>`;
    }
    svg += box(110, 168, 16, 80, 30, 12, 3);
    svg += `<g transform="${TOP(110, 168, 28)}"><rect class="detail" x="8" y="7" width="64" height="16" rx="8"/></g>`;
    svg += `<g id="lever" class="press lever on" data-press="toggle">`;
    svg += box(118, 174, 28, 48, 18, 12, 3);
    svg += `<g transform="${TOP(118, 174, 40)}"><text id="lever-label" class="label" x="16" y="12">ON</text><circle class="pip" cx="40" cy="8" r="2.2"/></g>`;
    svg += `</g>`;
    const flat = (x, y, z, id, cls, text, anchor = "start") => {
      const [sx, sy] = P(x, y, z);
      return `<text id="${id}" class="${cls}" x="${sx.toFixed(1)}" y="${sy.toFixed(1)}" text-anchor="${anchor}">${text}</text>`;
    };
    const [cx, cy] = P(78, 22, 72);
    svg += `<text class="quiet" x="${cx.toFixed(1)}" y="${(cy - 18).toFixed(1)}">SAME TASK</text>`;
    svg += `<text id="mode" class="lcd big" x="${cx.toFixed(1)}" y="${cy.toFixed(1)}">WITH TOOLS</text>`;
    svg += `<text id="score" class="lcd" x="${cx.toFixed(1)}" y="${(cy + 18).toFixed(1)}">3/3</text>`;
    for (const agent of agents) svg += flat(agent.x + 39, 152, 38, `${agent.id}-st`, "lcd big", "PASS", "middle");
    svg += dust([[36, 30, 120, 1.5], [270, 40, 120, 1.8], [20, 20, 80, 1.3], [290, 24, 96, 1.6], [160, 8, 180, 2], [90, 48, 100, 1.4], [230, 50, 92, 1.7]]);

    const stage = document.getElementById("stage");
    document.getElementById("scene").innerHTML = svg;

    const state = { tools: true, focus: null };
    const passes = (agent) => state.tools || agent.passWithout;

    function render() {
      document.getElementById("mode").textContent = state.tools ? "WITH TOOLS" : "NO TOOLS";
      document.getElementById("lever-label").textContent = state.tools ? "ON" : "OFF";
      const passed = agents.filter(passes).length;
      document.getElementById("score").textContent = `${passed}/3`;
      for (const agent of agents) {
        const ok = passes(agent);
        const el = document.getElementById(`${agent.id}-st`);
        el.textContent = ok ? "PASS" : "FAIL";
        el.classList.toggle("miss", !ok);
        document.getElementById(`agent-${agent.id}`).classList.toggle("lit", state.focus === agent.id);
      }
      document.getElementById("crystals").classList.toggle("on", state.tools);
      document.getElementById("dust").classList.toggle("on", state.tools);
      document.getElementById("lever").classList.toggle("on", state.tools);
      const mode = state.tools ? "with tools" : "without tools";
      const focused = agents.find((agent) => agent.id === state.focus);
      document.getElementById("readout").textContent = focused
        ? `agent ${focused.id} · ${mode} · ${passes(focused) ? "pass" : "fail"}`
        : `${mode} · pass ${passed}/3`;
    }

    function flash(name) {
      const el = stage.querySelector(`[data-press="${name}"]`);
      if (!el) return;
      el.classList.add("down");
      setTimeout(() => el.classList.remove("down"), 110);
    }
    function act(name) {
      if (name === "toggle") state.tools = !state.tools;
      else state.focus = state.focus === name ? null : name;
      render();
    }
    stage.addEventListener("click", (event) => {
      const el = event.target.closest("[data-press]");
      if (!el) return;
      flash(el.dataset.press);
      act(el.dataset.press);
    });
    window.addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.target.closest && event.target.closest("button")) return;
      const key = event.key.toLowerCase();
      if (key === "t" || key === "enter") { flash("toggle"); act("toggle"); event.preventDefault(); }
      else if (key === "a" || key === "b" || key === "c") { flash(key); act(key); event.preventDefault(); }
      else if (key === "escape" && state.focus) { state.focus = null; render(); event.preventDefault(); }
    });
    render();

    const NS = "http://www.w3.org/2000/svg";
    function plateSvg() {
      const live = stage;
      const clone = live.cloneNode(true);
      const shapes = new Set(["rect", "polygon", "path", "line", "circle", "polyline", "ellipse"]);
      const from = [live, ...live.querySelectorAll("*")];
      const to = [clone, ...clone.querySelectorAll("*")];
      from.forEach((el, index) => {
        const dest = to[index];
        const tag = el.tagName.toLowerCase();
        const cs = getComputedStyle(el);
        if (shapes.has(tag)) {
          dest.setAttribute("fill", cs.fill);
          dest.setAttribute("stroke", cs.stroke);
          if (cs.stroke !== "none") {
            dest.setAttribute("stroke-width", cs.strokeWidth);
            dest.setAttribute("stroke-linejoin", "round");
            dest.setAttribute("vector-effect", "non-scaling-stroke");
          }
        }
        if (tag === "text") {
          dest.setAttribute("fill", cs.fill);
          dest.setAttribute("font-family", "ui-monospace, Menlo, Consolas, monospace");
          dest.setAttribute("font-size", cs.fontSize);
        }
        if ((tag === "g" || tag === "circle") && cs.opacity !== "1") dest.setAttribute("opacity", cs.opacity);
      });
      clone.querySelector("style")?.remove();
      clone.removeAttribute("tabindex");
      clone.removeAttribute("role");
      clone.removeAttribute("aria-label");
      const vb = live.viewBox.baseVal;
      const top = 36;
      const bottom = 40;
      const wrap = document.createElementNS(NS, "svg");
      wrap.setAttribute("xmlns", NS);
      wrap.setAttribute("viewBox", `${vb.x} ${vb.y - top} ${vb.width} ${vb.height + top + bottom}`);
      wrap.setAttribute("width", String(vb.width));
      wrap.setAttribute("height", String(vb.height + top + bottom));
      const ink = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
      const hi = getComputedStyle(document.documentElement).getPropertyValue("--ink-hi").trim();
      const panel = getComputedStyle(document.documentElement).getPropertyValue("--panel").trim();
      const bg = document.createElementNS(NS, "rect");
      bg.setAttribute("x", String(vb.x));
      bg.setAttribute("y", String(vb.y - top));
      bg.setAttribute("width", String(vb.width));
      bg.setAttribute("height", String(vb.height + top + bottom));
      bg.setAttribute("fill", panel);
      wrap.appendChild(bg);
      const [fig, name, hint, readout] = [...document.querySelectorAll("figure .cap span")].map((el) => el.textContent.trim());
      const cap = (x, y, str, anchor, fill) => {
        const text = document.createElementNS(NS, "text");
        text.setAttribute("x", String(x));
        text.setAttribute("y", String(y));
        text.setAttribute("fill", fill);
        text.setAttribute("font-family", "ui-monospace, Menlo, Consolas, monospace");
        text.setAttribute("font-size", "13");
        text.setAttribute("letter-spacing", "1.8");
        text.setAttribute("text-anchor", anchor);
        text.textContent = str;
        return text;
      };
      wrap.append(cap(vb.x + 22, vb.y - 14, fig, "start", ink), cap(vb.x + vb.width - 22, vb.y - 14, name.toUpperCase(), "end", ink));
      while (clone.firstChild) wrap.appendChild(clone.firstChild);
      wrap.append(cap(vb.x + 22, vb.y + vb.height + 24, hint.toUpperCase(), "start", ink), cap(vb.x + vb.width - 22, vb.y + vb.height + 24, readout, "end", hi));
      return `<?xml version="1.0" encoding="UTF-8"?>\n${new XMLSerializer().serializeToString(wrap)}`;
    }
    window.plateSvg = plateSvg;
    document.getElementById("save").addEventListener("click", () => {
      const blob = new Blob([plateSvg()], { type: "image/svg+xml" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "tracks-fig-1-experiment.svg";
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    });
  </script>
</body>
</html>
