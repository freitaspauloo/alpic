<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#051413" />
    <title>Sign in to Alpic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Mozilla+Text:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --midnight: #051413;
        --ink: #f4f2eb;
        --muted: #a4b1ac;
        --hover: #142624;
      }
      body {
        margin: 0;
        overflow-x: clip;
        background: var(--midnight);
        color: var(--ink);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: #a2e8ef;
        color: var(--midnight);
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid #a2e8ef;
        outline-offset: 5px;
      }
      main {
        min-height: 100svh;
        max-width: 1760px;
        margin: auto;
        display: grid;
        grid-template-columns: minmax(0, 378px) minmax(0, 1fr);
        column-gap: 40px;
        align-items: center;
        padding: 100px 0 60px 7.3%;
        position: relative;
        overflow: visible;
      }
      .sign-in {
        width: 100%;
        max-width: 378px;
        position: relative;
        z-index: 1;
        text-align: center;
        background: transparent;
      }
      h1 {
        font-family: "Mozilla Text", sans-serif;
        font-size: clamp(30px, 3.2vw, 52px);
        font-weight: 400;
        line-height: 1.16;
        letter-spacing: -0.03em;
        margin: 0;
        white-space: nowrap;
      }
      .subtitle {
        color: var(--muted);
        font-size: 17px;
        line-height: 1.5;
        margin: 16px 0 0;
      }
      .subtitle:empty {
        display: none;
      }
      .buttons {
        background: transparent;
        margin-top: 46px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .btn {
        border: 1px solid var(--ink);
        border-radius: 2px;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 62px;
        width: 100%;
        gap: 16px;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.4;
        transition:
          background-color 160ms,
          border-color 160ms,
          transform 160ms;
        position: relative;
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn svg {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }
      .btn-github svg {
        fill: currentColor;
      }
      .btn-secondary {
        border-color: transparent;
        min-height: 44px;
        font-size: 14px;
        font-weight: 400;
      }
      .btn-sso {
        margin-top: 20px;
      }
      .separator {
        width: 28px;
        height: 1px;
        background: var(--muted);
        margin: 4px auto;
      }
      .btn:disabled {
        cursor: wait;
        opacity: 0.45;
      }
      .btn[aria-busy="true"] {
        opacity: 1;
      }
      .btn[aria-busy="true"]::after {
        content: "";
        width: 16px;
        height: 16px;
        border: 1px solid var(--muted);
        border-top-color: var(--ink);
        border-radius: 50%;
        animation: spin 800ms linear infinite;
        position: absolute;
        right: 14px;
      }
      .error {
        font-size: 14px;
        line-height: 1.5;
        color: #ffa5b9;
        text-align: left;
        margin: 18px 0 0;
      }
      .error:empty {
        display: none;
      }
      .terrain {
        margin: 0;
        width: 100vw;
        position: absolute;
        left: calc(50% - 50vw);
        right: auto;
        top: 0;
        bottom: 0;
      }
      .terrain-stage {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #mountain,
      .mountain-fallback {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
      }
      #mountain {
        opacity: 0;
        touch-action: pan-y;
        cursor: grab;
      }
      #mountain.grabbing {
        cursor: grabbing;
      }
      .mountain-fallback {
        object-fit: contain;
      }
      .ready #mountain {
        opacity: 1;
      }
      .ready .mountain-fallback {
        visibility: hidden;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes settle {
        from {
          transform: translateY(10px);
          opacity: 0.4;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .sign-in {
          animation: settle 650ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }
      }
      @media (max-width: 1000px) and (min-width: 901px) {
        main {
          padding-left: 5%;
          grid-template-columns: minmax(0, 300px) minmax(0, 1fr);
        }
        .sign-in {
          max-width: 300px;
        }
        .btn {
          font-size: 14px;
        }
        h1 {
          font-size: 32px;
        }
      }
      @media (max-width: 900px) {
        main {
          min-height: auto;
          padding: 64px 24px 0;
          display: flex;
          flex-direction: column;
        }
        .terrain {
          order: 1;
          position: relative;
          inset: auto;
          width: calc(100% + 48px);
          max-width: none;
          margin: -16px 0 0;
        }
        .terrain-stage {
          height: clamp(375px, calc(52svh + 36px), 536px);
          aspect-ratio: auto;
        }
        .sign-in {
          max-width: 390px;
          text-align: left;
        }
        h1 {
          font-size: 30px;
        }
        .subtitle {
          font-size: 16px;
          margin: 10px 0 0;
        }
        .btn {
          min-height: 52px;
          font-size: 15px;
        }
        .btn-secondary {
          min-height: 44px;
          font-size: 14px;
        }
        .buttons {
          margin-top: 28px;
          gap: 12px;
        }
        .btn-sso {
          margin-top: 16px;
        }
        .separator {
          margin: 0 auto;
        }
      }
      @media (max-width: 900px) and (max-height: 740px) {
        .terrain-stage {
          height: 340px;
        }
        .terrain {
          margin-bottom: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="sign-in" aria-labelledby="sign-in-title">
        <h1 id="sign-in-title">Sign in to Alpic</h1>
        <p class="subtitle" id="destination"></p>
        <div class="buttons" aria-label="Sign-in methods">
          <button class="btn btn-google" data-provider="google" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"
              />
              <path
                fill="#34A853"
                d="M12 22c2.7 0 4.96-.9 6.62-2.42l-3.24-2.51c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.59A10 10 0 0 0 12 22Z"
              />
              <path fill="#FBBC05" d="M6.41 13.91a6 6 0 0 1 0-3.82V7.5H3.07a10 10 0 0 0 0 9l3.34-2.59Z" />
              <path
                fill="#EA4335"
                d="M12 5.97c1.47 0 2.79.5 3.82 1.49l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.93 5.5l3.34 2.59A5.99 5.99 0 0 1 12 5.97Z"
              /></svg
            ><span>Google</span>
          </button>
          <button class="btn btn-github" data-provider="github" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
              /></svg
            ><span>GitHub</span>
          </button>
          <button class="btn btn-secondary btn-sso" data-provider="workos" type="button">
            <span>SSO</span>
          </button>
          <span class="separator" aria-hidden="true"></span>
          <button class="btn btn-secondary" data-provider="agentid" type="button"><span>AgentID</span></button>
        </div>
        <p class="error" id="error" role="alert"></p>
        <noscript><p class="error">Enable JavaScript to sign in to your Alpic account.</p></noscript>
      </section>
      <figure class="terrain" aria-label="Interactive Alpine terrain">
        <div class="terrain-stage">
          <img class="mountain-fallback" src="/assets/alpic-mountain.png" alt="Pink and ice-blue Alpine peaks" />
          <canvas
            id="mountain"
            tabindex="-1"
            aria-hidden="true"
            role="img"
            aria-label="Rotating 3D mountain with sparkling snow. Drag to rotate, or use the arrow keys. Home resets the view. Space pauses animation."
          ></canvas>
        </div>
      </figure>
    </main>
    <script type="module" src="/mountain.js?v=20261029"></script>
    <script type="module">
      const errorMessages = new Map([
        [
          "account_not_linked",
          "This email is already linked to another sign-in method. Sign in with the method you used first.",
        ],
        ["access_denied", "Sign-in was cancelled. Choose a sign-in method to try again."],
      ]);
      const error = document.getElementById("error");
      const params = new URLSearchParams(location.search);
      const errorCode = params.get("error");
      if (errorCode)
        error.textContent = errorMessages.get(errorCode) ?? "We couldn’t complete sign-in. Please try again.";
      // Forward only the signed authorization parameters, unchanged.
      const signedNames = params.getAll("ba_param");
      const oauthQuery = new URLSearchParams();
      for (const [key, value] of params) {
        if (key === "sig" || signedNames.includes(key)) oauthQuery.append(key, value);
      }
      const clientId = oauthQuery.get("client_id");
      if (clientId) {
        fetch("/api/auth/oauth2/public-client-prelogin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ client_id: clientId, oauth_query: oauthQuery.toString() }),
        })
          .then(async (response) => {
            if (!response.ok) return;
            const client = await response.json();
            if (typeof client.client_name === "string" && client.client_name.trim()) {
              document.getElementById("destination").textContent = `Continue to ${client.client_name}`;
            }
          })
          .catch(() => {
            /* A missing app label must never block sign-in. */
          });
      }
      const buttons = [...document.querySelectorAll("[data-provider]")];
      let pending = false;
      for (const btn of buttons) {
        btn.onclick = async () => {
          if (pending) return;
          pending = true;
          buttons.forEach((button) => {
            button.disabled = true;
          });
          btn.setAttribute("aria-busy", "true");
          error.textContent = "";
          try {
            const response = await fetch("/api/auth/sign-in/social", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              signal: AbortSignal.timeout(20000),
              body: JSON.stringify({
                provider: btn.dataset.provider,
                errorCallbackURL: `/sign-in?${oauthQuery}`,
                oauth_query: oauthQuery.toString(),
              }),
            });
            const body = await response.json();
            if (!response.ok || !body.url) {
              error.textContent =
                errorMessages.get(body.code) ?? body.message ?? "We couldn’t start sign-in. Please try again.";
              return;
            }
            location.assign(body.url);
          } catch {
            error.textContent = "Couldn’t connect. Check your connection and try again.";
          } finally {
            pending = false;
            buttons.forEach((button) => {
              button.disabled = false;
            });
            btn.removeAttribute("aria-busy");
          }
        };
      }
    </script>
  </body>
</html>
